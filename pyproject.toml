[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hfm-dashboard"
version = "0.1.0"
description = "HFM availability dashboard: status model, stability score and caution notices"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6",
]

[project.optional-dependencies]
# Added slice by slice as adapters arrive: fastapi, apscheduler, httpx, pypsrp, pyodbc, playwright
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
