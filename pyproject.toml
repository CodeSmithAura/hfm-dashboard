[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hfm-dashboard"
version = "0.1.0"
description = "HFM availability dashboard: status model, stability score and caution notices"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6",
    "pypsrp>=0.8",          # WinRM / PowerShell remoting (Windows services collector)
    "httpx>=0.27",          # WebLogic REST and URL probes
    "truststore>=0.9",      # verify TLS against the Windows certificate store (corporate CA)
    "pyodbc>=5.1",          # SQL Server health queries (needs ODBC Driver 18 for SQL Server at runtime)
    "APScheduler>=3.10,<4", # poll scheduling (3.x API)
    "fastapi>=0.110",       # dashboard web app and JSON API
    "uvicorn>=0.29",        # dashboard web server
    "jinja2>=3.1",          # dashboard templates (replaceable, see docs/ui.md)
]

[project.optional-dependencies]
# Added slice by slice as adapters arrive: playwright
dev = ["pytest>=8"]

[project.scripts]
hfm-check-services = "hfm_dashboard.tools.check_services:main"
hfm-dashboard = "hfm_dashboard.app.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hfm_dashboard = ["web/templates/*.html", "web/templates/partials/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
